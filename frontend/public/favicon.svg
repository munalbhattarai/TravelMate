<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Circular Badge: Deep Forest Pine -->
  <circle cx="32" cy="32" r="30" fill="#064e3b"/>
  <!-- Subtle Inner Border Highlight -->
  <circle cx="32" cy="32" r="28" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.3" fill="none"/>

  <!-- High-Contrast Mountain Peaks in PURE WHITE -->
  <!-- Left Peak -->
  <path d="M 8 46 L 22 24 L 36 46 Z" fill="#ffffff" fill-opacity="0.9"/>
  <!-- Right Mountain Ridge Shadow -->
  <path d="M 22 24 L 36 46 L 22 46 Z" fill="#cbd5e1" fill-opacity="0.6"/>

  <!-- Main Center High Peak (Prominent) -->
  <path d="M 20 46 L 36 14 L 52 46 Z" fill="#ffffff"/>
  <!-- Right Slope Shading for 3D depth -->
  <path d="M 36 14 L 52 46 L 36 46 Z" fill="#e2e8f0"/>

  <!-- Center Guidance Ring (High Contrast Pure White / Amber) -->
  <circle cx="32" cy="36" r="11" fill="#064e3b" stroke="#f59e0b" stroke-width="2.5"/>

  <!-- 8-Point Golden Compass Star (Bold & Radiant) -->
  <!-- Diagonal Points -->
  <polygon points="32,36 36,31 32,33 28,31" fill="#fbbf24"/>
  <polygon points="32,36 36,41 32,39 28,41" fill="#fbbf24"/>
  <polygon points="32,36 34,38 32,34 30,38" fill="#fbbf24"/>
  <polygon points="32,36 34,34 32,38 30,34" fill="#fbbf24"/>

  <!-- Cardinal Points (North, South, East, West) -->
  <!-- North (Pointing Up to Peak) -->
  <polygon points="32,22 34.5,36 32,34 29.5,36" fill="#fbbf24"/>
  <polygon points="32,22 32,34 34.5,36" fill="#f59e0b"/>
  <!-- South -->
  <polygon points="32,50 34.5,36 32,38 29.5,36" fill="#d97706"/>
  <polygon points="32,50 32,38 34.5,36" fill="#b45309"/>
  <!-- East -->
  <polygon points="46,36 32,38.5 34,36 32,33.5" fill="#f59e0b"/>
  <polygon points="46,36 34,36 32,38.5" fill="#d97706"/>
  <!-- West -->
  <polygon points="18,36 32,38.5 30,36 32,33.5" fill="#fbbf24"/>
  <polygon points="18,36 30,36 32,38.5" fill="#f59e0b"/>

  <!-- Star Core Jewel -->
  <circle cx="32" cy="36" r="2.5" fill="#ffffff"/>
  <circle cx="32" cy="36" r="1.2" fill="#d97706"/>
</svg>